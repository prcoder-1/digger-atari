# Конфигурация линковщика для ЗАСТАВКИ.
#
# Заставка - отдельная программа, которая кладётся в файл игры ПЕРЕД ней и
# запускается загрузчиком DOS до неё: у последнего куска стоит вектор INITAD
# ($02E2), а его загрузчик вызывает как подпрограмму. Отработала, вернулась -
# DOS грузит куски игры ПОВЕРХ заставки и запускает игру вектором RUNAD.
#
# Отсюда две вещи:
#
#   1. Памяти заставка не отнимает совсем. Она лежит там, где потом будет
#      игра ($2400..), и переживать загрузку ей не нужно.
#   2. Своего стартового кода библиотеки cc65 здесь нет: программа не
#      запускается, а ВЫЗЫВАЕТСЯ. Указатель стека Си и обнуление BSS делает
#      title/crt.s.
#
# Раскладка:
#   $2400..$87FF  TMAIN   - код, данные, BSS заставки
#   $8800..$8BFF  TDLIST  - дисплей-лист (не пересекает границу 1 КБ)
#   $8C00..$8FFF  TSTACK  - стек Си заставки
#   $9000..$AEFF  COVER   - обложка, 7680 байт экрана ANTIC E; грузится
#                           КУСКОМ ФАЙЛА прямо туда, где её покажет ANTIC
#   $B000..$CFFF  TSCRBUF - кадровый буфер ANTIC F под демо (не в файле)
#
# Всё это - будущая память игры: $2400 у неё начало MAIN, $9000 - кадровый
# буфер. Пересечься они не могут, потому что во времени не встречаются.

FEATURES {
    STARTADDRESS: default = $2400;
}

SYMBOLS {
    __STARTADDRESS__: type = export, value = %S;
    # Вершина стека Си заставки: растёт вниз от конца своей области
    __TSTACKTOP__:    type = export, value = $9000;
}

MEMORY {
    ZP:         file = "",               start = $0082, size = $007E;

    # Признак двоичного файла: $FFFF один раз в начале
    HEADER:     file = %O,               start = $0000, size = $0002;

    # Кусок с обложкой: четыре байта "откуда-докуда" и сами данные
    COVERHDR:   file = %O,               start = $0000, size = $0004;
    COVERCHNK:  file = %O, define = yes, start = $9000, size = $1E00;

    # Кусок с кодом заставки
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    TMAIN:      file = %O, define = yes, start = %S,    size = $8800 - %S;

    # Вектор INITAD последним куском: его загрузчик и вызывает
    TRAILER:    file = %O,               start = $0000, size = $0006;

    # Не в файле - только адреса
    TDLIST:     file = "", define = yes, start = $8800, size = $0400;
    TSCRBUF:    file = "", define = yes, start = $B000, size = $2100;
}

SEGMENTS {
    ZEROPAGE:   load = ZP,                             type = zp;
    EXTZP:      load = ZP,                             type = zp,  optional = yes;

    TEXEHDR:    load = HEADER,                         type = ro;

    COVERHDR:   load = COVERHDR,                       type = ro;
    COVER:      load = COVERCHNK,                      type = ro,  define = yes;

    MAINHDR:    load = MAINHDR,                        type = ro;
    STARTUP:    load = TMAIN,                          type = ro,  define = yes;
    CODE:       load = TMAIN,                          type = ro,  define = yes;
    RODATA:     load = TMAIN,                          type = ro;
    DATA:       load = TMAIN,                          type = rw;
    # Спрайты игры в заставке лежат обычной памятью: прятать их под ПЗУ
    # незачем, места здесь вдоволь, а ПЗУ ОС заставке ещё нужно. Все куски,
    # которые пишутся в ФАЙЛ, обязаны стоять ДО BSS: конец куска считается по
    # её адресу загрузки, см. title/crt.s.
    SHADOW_RAM:  load = TMAIN,                         type = ro,  optional = yes;
    SHADOW_RAM2: load = TMAIN,                         type = ro,  optional = yes;
    BSS:        load = TMAIN,                          type = bss, define = yes;

    TRAILER:    load = TRAILER,                        type = ro;

    DLIST:      load = TDLIST,                         type = bss, define = yes;
    SCRBUF:     load = TSCRBUF,                        type = bss, define = yes;
}
