# Конфигурация линковщика для Digger / ATARI 65XE (цель cc65 "atari", этапы M0-M4)
#
# Раскладка памяти:
#   $2000..$8BFF  MAIN   - код, данные, RODATA, BSS      (27648 байт)
#   $8C00..$8FFF  стек Си                                 (1024 байта)
#   $9000..$B09F  SCRBUF - кадровый буфер ANTIC E         (8352 байта, выровнен на 4К)
#   $B0A0..$B3FF  свободно
#   $B400..$B4FF  DLIST  - дисплей-лист                   (256 байт, не пересекает 1К)
#   $B500..$BC1F  свободно
#
# Кадровый буфер разбит на три прогона, чтобы ни один не пересекал границу 4096:
#   строки   0..101 -> $9010..$9FFF  (4080 байт)
#   строки 102..203 -> $A000..$AFEF  (4080 байт)
#   16 байт дырки   -> $AFF0..$AFFF
#   строки 204..207 -> $B000..$B09F  (160 байт)
# Из-за дырки буфер не непрерывен - адреса строк берутся из таблиц screen_rowlo/hi.

FEATURES {
    STARTADDRESS: default = $2000;
}

SYMBOLS {
    __EXEHDR__:          type = import;
    __AUTOSTART__:       type = import;
    __STACKSIZE__:       type = weak, value = $0400;
    __STARTADDRESS__:    type = export, value = %S;
    # $9000..$BC1F отдано под экран и дисплей-лист: рантайм опустит MEMTOP
    __RESERVED_MEMORY__: type = weak, value = $2C20;
}

MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;

    HEADER:     file = %O,               start = $0000, size = $0002;
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,
                size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;
    TRAILER:    file = %O,               start = $0000, size = $0006;

    # Не попадают в XEX - только резервируют адреса
    SCRBUF:     file = "",               start = $9000, size = $20A0;
    DLIST:      file = "",               start = $B400, size = $0100;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,      type = zp;
    EXTZP:     load = ZP,      type = zp,                optional = yes;
    EXEHDR:    load = HEADER,  type = ro;
    MAINHDR:   load = MAINHDR, type = ro;
    STARTUP:   load = MAIN,    type = ro,  define = yes;
    LOWCODE:   load = MAIN,    type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,    type = ro,                optional = yes;
    CODE:      load = MAIN,    type = ro,  define = yes;
    RODATA:    load = MAIN,    type = ro;
    # На цели atari ОЗУ под ПЗУ нет, поэтому оба "теневых" сегмента просто
    # ложатся в MAIN. Имена общие с цели atarixl, чтобы один и тот же
    # assets/sprites.s собирался обеими сборками без правок.
    SHADOW_RAM:  load = MAIN,  type = ro,                optional = yes;
    SHADOW_RAM2: load = MAIN,  type = ro,                optional = yes;
    SPRITES:   load = MAIN,    type = ro,                optional = yes;
    LEVELS:    load = MAIN,    type = ro,                optional = yes;
    DATA:      load = MAIN,    type = rw;
    INIT:      load = MAIN,    type = rw,                optional = yes;
    BSS:       load = MAIN,    type = bss, define = yes;
    AUTOSTRT:  load = TRAILER, type = ro;

    SCRBUF:    load = SCRBUF,  type = bss, define = yes;
    DLIST:     load = DLIST,   type = bss, define = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
