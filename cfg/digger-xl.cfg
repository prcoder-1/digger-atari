# Конфигурация линковщика для Digger, цель cc65 "atarixl".
#
# ПЗУ операционной системы выключается через PORTB, и освобождается ОЗУ под
# ним. Спрайты уезжают туда, а MAIN остаётся целиком под код и данные.
#
# Раскладка:
#   $2400..$8BFF  MAIN    - код, данные, RODATA, BSS, уровни
#   $8C00..$8FFF  стек Си
#   $9000..$B09F  SCRBUF  - кадровый буфер ANTIC F (8352 байта, выровнен на 4К)
#   $B400..$B4FF  DLIST   - дисплей-лист
#   $B500..$B7FF  ROWTAB  - таблицы адресов строк растра
#   $B800..$BFFF  PMGBUF  - буфер аппаратных спрайтов (сборка DIGGER_PMG)
#   $C000..$CFFF  HIDDEN_RAM3 - таблицы поля (4096 байт)
#   $D800..$DFFF  HIDDEN_RAM2 - вторая часть спрайтов (2048 байт)
#   $E000..$E3FF  CHARGEN - знакогенератор, ЗАНЯТ (из него читает text.c)
#   $E400..$FFF9  HIDDEN_RAM  - первая часть спрайтов (7162 байта)
#
# Спрайты разложены по двум сегментам потому, что свободные куски ОЗУ под ПЗУ
# несмежны: между ними лежит знакогенератор, и одним сегментом их не занять.
# Имена SHADOW_RAM и SHADOW_RAM2 менять нельзя: процедура копирования под ПЗУ
# в библиотеке cc65 ссылается на __SHADOW_RAM_LOAD__ и подобные символы.
# Что не влезло под ПЗУ, конвертер кладёт в RODATA, то есть в обычную память.
#
# Сегменты SHADOW_RAM грузятся в промежуточную область SRPREPCHNK и
# копируются под ПЗУ стартовым кодом библиотеки.
#
# Знакогенератор по $E000 трогать нельзя: text.c читает шрифт именно оттуда,
# и цель atarixl специально сохраняет его по прежнему адресу.

FEATURES {
    STARTADDRESS: default = $2400;
}

SYMBOLS {
    __EXEHDR__:       type = import;
    __SYSTEM_CHECK__: type = import;
    __AUTOSTART__:    type = import;
    # Стек Си. Замерено по сгенерированному коду: самый крупный кадр - 11
    # байт (subysp #$0B), обычные 1..7, а рекурсии в игре нет вовсе -
    # цепочка мешков проходится списком (см. src/bags.c). Даже дюжина
    # вложенных вызовов укладывается в две с небольшим сотни байт, так что
    # 768 - это троекратный запас. Прежние 1024 просто отнимали место у
    # MAIN, куда игра уже не влезала.
    # Стек Си урезан до $0200: MAIN упирается в предел, а глубина вызовов
    # здесь мелкая - рекурсии в порте нет намеренно (толкание мешков написано
    # итерацией), локальных переменных единицы. 512 байт с запасом.
    #
    # Пробовал вместо этого унести карты уровней в свободное ОЗУ по $B0A0:
    # игра не запускается совсем, чёрный экран. Область между экранным буфером
    # и дисплей-листом трогать нельзя.
    __STACKSIZE__:    type = weak, value = $0200;
    __STARTADDRESS__: type = export, value = %S;
}

MEMORY {
    ZP:          file = "", define = yes, start = $0082, size = $007E;

    HEADER:      file = %O,               start = $0000, size = $0002;

    SYSCHKHDR:   file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK:  file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:   file = %O,               start = $0000, size = $0006;

    SRPREPHDR:   file = %O,               start = $0000, size = $0004;
    SRPREPCHNK:  file = %O, define = yes, start = %S,    size = $7C20 - %S - $07FF;
    SRPREPTRL:   file = %O,               start = $0000, size = $0006;

    MAINHDR:     file = %O,               start = $0000, size = $0004;
    MAIN:        file = %O, define = yes, start = %S + __LOWBSS_SIZE__,
                 size = $9000 - __STACKSIZE__ - %S - __LOWBSS_SIZE__;
    TRAILER:     file = %O,               start = $0000, size = $0006;

    # Не попадают в XEX - только резервируют адреса
    SCRBUF:      file = "",               start = $9000, size = $20A0;
    DLIST:       file = "",               start = $B400, size = $0100;

    # Между дисплей-листом и буфером спрайтов лежит свободное ОЗУ. Туда
    # уехали таблицы адресов строк растра: они занимают 416 байт, а MAIN был
    # переполнен. Обнулять их не нужно - screen_init заполняет обе целиком.
    ROWTAB:      file = "",               start = $B500, size = $0300;

    # Однострочное разрешение PMG требует 2 КБ, выровненных на 2 КБ: ANTIC
    # берёт из PMBASE только старшие пять бит адреса. $B800 подходит и
    # свободен - между дисплей-листом и HIDDEN_RAM2 ничего нет.
    PMGBUF:      file = "",               start = $B800, size = $0800;

    # Третий кусок ОЗУ под ПЗУ. На XL при выключенном ПЗУ операционной
    # системы (бит 0 в PORTB) $C000..$CFFF - обычная память, и в раскладке
    # она простаивала: кадровый буфер со спрайтами кончается на $BFFF, а
    # HIDDEN_RAM2 начинается только с $D800. Между ними лежат 4 КБ, которые
    # игре очень нужны - MAIN был забит под завязку.
    #
    # Сюда кладётся только BSS: копировать её не надо, а значит не нужна и
    # процедура переноса под ПЗУ из библиотеки cc65 (она знает лишь про
    # SHADOW_RAM и SHADOW_RAM2). Обнулением этот сегмент тоже не охвачен,
    # поэтому в него идут ТОЛЬКО массивы, которые заполняются целиком до
    # первого чтения - см. field_init в src/field.c.
    HIDDEN_RAM3: file = "", define = yes, start = $C000, size = $1000;
    HIDDEN_RAM2: file = "", define = yes, start = $D800, size = $0800;
    CHARGEN:     file = "", define = yes, start = $E000, size = $0400;
    HIDDEN_RAM:  file = "", define = yes, start = $E400, size = $FFFA - $E400;
}

SEGMENTS {
    ZEROPAGE:    load = ZP,                            type = zp;
    EXTZP:       load = ZP,                            type = zp,  optional = yes;

    EXEHDR:      load = HEADER,                        type = ro;

    SYSCHKHDR:   load = SYSCHKHDR,                     type = ro,  optional = yes;
    SYSCHK:      load = SYSCHKCHNK,                    type = rw,  define = yes, optional = yes;
    SYSCHKTRL:   load = SYSCHKTRL,                     type = ro,  optional = yes;

    SRPREPHDR:   load = SRPREPHDR,                     type = ro;
    LOWBSS:      load = SRPREPCHNK,                    type = bss, define = yes;
    SRPREP:      load = SRPREPCHNK,                    type = rw,  define = yes;
    SHADOW_RAM:  load = SRPREPCHNK, run = HIDDEN_RAM,  type = rw,  define = yes, optional = yes;
    SHADOW_RAM2: load = SRPREPCHNK, run = HIDDEN_RAM2, type = rw,  define = yes, optional = yes;
    SRPREPTRL:   load = SRPREPTRL,                     type = ro;

    MAINHDR:     load = MAINHDR,                       type = ro;
    STARTUP:     load = MAIN,                          type = ro,  define = yes;
    LOWCODE:     load = MAIN,                          type = ro,  define = yes, optional = yes;
    ONCE:        load = MAIN,                          type = ro,  optional = yes;
    CODE:        load = MAIN,                          type = ro,  define = yes;
    RODATA:      load = MAIN,                          type = ro;
    LEVELS:      load = MAIN,                          type = ro,  optional = yes;
    DATA:        load = MAIN,                          type = rw;
    INIT:        load = MAIN,                          type = rw,  optional = yes;
    BSS:         load = MAIN,                          type = bss, define = yes;
    BSS_HI:      load = HIDDEN_RAM3,                   type = bss, define = yes, optional = yes;
    AUTOSTRT:    load = TRAILER,                       type = ro;

    SCRBUF:      load = SCRBUF,                        type = bss, define = yes;
    DLIST:       load = DLIST,                         type = bss, define = yes;
    ROWTAB:      load = ROWTAB,                        type = bss, define = yes;
    PMGBUF:      load = PMGBUF,                        type = bss, define = yes, optional = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
